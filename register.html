<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="./assets/style2.css">
</head>
<body>

<div class="container">
  <h2>Sign Up</h2>

  <form id="registerForm">
    <input type="text" id="fullname" placeholder="Fullname" />
    <p class="user_fn"></p>

    <input type="email" id="email" placeholder="Email" />
    <p class="user_err"></p>

    <input type="password" id="password" placeholder="Password" />
    <p class="user_pass"></p>

    <input type="password" id="conf_password" placeholder="Confirm Password" />
    <p class="user_cfpass"></p>

    <p id="errorMessage" style="color:red;"></p>

    <button type="submit" class="btn_reg">Đăng ký</button>
    <button type="button" class="btn_reg">
      <a href="./login.html">Đăng nhập</a>
    </button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBRsYiJX-i97pt7gmg0t0fRrJiKPYmtn_s",
    authDomain: "jsi36-a45bc.firebaseapp.com",
    projectId: "jsi36-a45bc",
    storageBucket: "jsi36-a45bc.firebasestorage.app",
    messagingSenderId: "346562660239",
    appId: "1:346562660239:web:18be6a1d29bd8d600dedfa",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const registerForm = document.getElementById("registerForm");
  const errorMessage = document.getElementById("errorMessage");

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMessage.textContent = "";

    const fullName = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("conf_password").value;

    if (!fullName || !email || !password) {
      errorMessage.textContent = "Vui lòng nhập đầy đủ thông tin!";
      return;
    }

    if (password !== confirmPassword) {
      errorMessage.textContent = "Mật khẩu xác nhận không khớp!";
      return;
    }

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      await updateProfile(user, {
        displayName: fullName,
      });

      await setDoc(doc(db, "users", user.uid), {
        fullName: fullName,
        email: email,
        createdAt: new Date().toISOString(),
      });

      alert("Đăng ký thành công!");
      window.location.href = "login.html";

    } catch (error) {
      errorMessage.textContent = error.message;
      console.error(error);
    }
  });
</script>

</body>
</html>
